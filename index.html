<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@600;700&family=Grenze+Gotisch:wght@600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>GymLog</title>
<style>
:root{
  --bg:#000;--card:#141414;--card-hi:#1b1b1b;--field:#232323;--line:rgba(255,255,255,.08);
  --tx:#f5f5f7;--mut:#8e8e93;--dim:#48484a;--ac:#fff;--on-ac:#000;--dan:#ff453a;
  --hl:255,255,255;--nav-bg:rgba(28,28,30,.82);--nav-off:#6e6e73;--nav-on:#fff;--sheet:#161616;--timer-bg:rgba(28,28,30,.92);
  --toast-bg:#fff;--toast-tx:#000;--switch-on:#fff;--knob-on:#000;--body-off:#2c2c2e;--body-head:#1c1c1e;--body-stroke:#000;
  --thumb-filter:grayscale(1) contrast(1.05);--pop:0 10px 40px rgba(0,0,0,.6);--title-font:var(--font);
  --r:26px;color-scheme:dark;--font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 var(--font);overflow-x:hidden;-webkit-font-smoothing:antialiased}
main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
body.has-timer main{padding-bottom:calc(190px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
h1{font-family:var(--title-font);font-size:34px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}
h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}
h3{font-size:17px;font-weight:600;margin:0 0 10px}
p{margin:6px 0}
b{font-weight:600}
.muted{color:var(--mut)}.small{font-size:13px}.center{text-align:center}

/* Cabecera */
.top{display:flex;align-items:center;gap:10px;margin:10px 0 22px}
.top>div:first-child{flex:1;min-width:0}
.eyebrow{color:var(--mut);font-size:14px;margin:0 0 2px}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card-hi);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font:600 13px var(--font);cursor:pointer;padding:0}
.round.sm{width:38px;height:38px}
.round.light{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.round.danger{color:var(--dan)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
.link{background:none;border:0;color:var(--mut);font:500 14px var(--font);cursor:pointer;padding:4px}

/* Widgets y tarjetas */
.w,.card{background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(var(--hl),.05);color:var(--tx);font:inherit;text-align:left}
.card{padding:16px;margin-bottom:12px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w{padding:16px;position:relative;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.w.sq{aspect-ratio:1/1;justify-content:space-between}
.w.wide{grid-column:1/-1}
.wico{position:absolute;top:16px;right:16px;color:var(--mut)}
.wfoot b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfoot small,.wrow small,.rtinfo small{display:block;color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.big{white-space:nowrap}
.big small{font-size:16px;color:var(--mut);font-weight:500;letter-spacing:0;margin-left:4px}
.big.sm{font-size:30px}
.ring text{fill:var(--tx);font:600 20px var(--font)}
.ring .bg{stroke:var(--dim)}.ring .fg{stroke:var(--ac);transition:stroke-dashoffset .4s}
.mcal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.mcal .ml{display:block;text-align:center;font-size:14px;margin-bottom:10px;text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px 3px;justify-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--ac);width:5px;height:5px;margin:-.5px;box-shadow:0 0 5px 1px rgba(var(--hl),.45)}
.dot.today{outline:1px solid var(--mut);outline-offset:2px}
.wrow{display:flex;align-items:center;gap:12px;min-width:0}
.wrow>div{min-width:0}
.wrow .round{pointer-events:none}
.hrow{display:flex;align-items:center;gap:12px}
.hrow>div:first-child{flex:1;min-width:0}
.bars{display:flex;align-items:flex-end;gap:4px;height:34px}
.bars i{width:6px;border-radius:3px;background:var(--dim);min-height:4px}
.bars i.on{background:var(--ac)}
.live{border-color:rgba(var(--hl),.35);box-shadow:0 0 0 1px rgba(var(--hl),.1),0 0 30px rgba(var(--hl),.06)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block;margin-right:8px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.rt{flex-direction:row;align-items:center;gap:12px;margin-bottom:12px;cursor:default}
.rtinfo{flex:1;min-width:0}
.rtinfo b{display:block;font-size:17px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:12px;flex-direction:row}
.banner>div{flex:1;min-width:0}
.banner p{margin:2px 0 0;color:var(--mut);font-size:13px}

/* Botones y campos */
.btn{appearance:none;border:1px solid var(--line);background:var(--card-hi);color:var(--tx);font:600 16px var(--font);padding:14px 18px;border-radius:18px;cursor:pointer;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--dan)}
.btn.block{display:flex;width:100%;margin:10px 0}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:14px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
input,select{font:inherit;color:var(--tx);background:var(--field);border:1px solid transparent;border-radius:14px;padding:12px 14px;width:100%;min-height:48px;outline:none}
input:focus,select:focus{border-color:rgba(var(--hl),.4)}
input::placeholder{color:var(--dim)}
.field{display:block;margin:10px 0;color:var(--mut);font-size:13px}
.field input,.field select{margin-top:6px;color:var(--tx)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:16px}
.seg button{flex:1;background:none;border:0;color:var(--mut);font:600 15px var(--font);padding:11px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.seg button.on{background:var(--field);color:var(--tx)}

/* Entreno */
.wk-t{flex:1;min-width:0;text-align:center}
.wk-name{font-size:18px;font-weight:600;background:transparent;text-align:center;padding:2px;min-height:0}
#elapsed{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.ex-head{display:flex;align-items:center;gap:12px}
.ex-t{flex:1;min-width:0}.ex-t b{display:block;font-size:17px}.ex-t small{color:var(--mut);font-size:13px}
.rest{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;margin:14px 0 6px}
.rest input{width:64px;min-height:34px;padding:4px 8px;text-align:center;border-radius:10px}
.sets{margin:6px 0 8px}
.srow{display:grid;grid-template-columns:34px 1.1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:5px 4px;border-radius:16px}
.sets.nw .srow{grid-template-columns:34px 1.2fr 1.4fr 44px}
.srow.h{font-size:12px;color:var(--mut);padding-bottom:0;text-align:center}
.srow.done{background:rgba(var(--hl),.07)}
.srow input{text-align:center;padding:10px 4px;min-height:44px;font-variant-numeric:tabular-nums}
.srow.done input{background:transparent}
.prev{font-size:13px;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setn{background:none;border:0;color:var(--mut);font:600 15px var(--font);height:34px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chk{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--dim);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.srow.done .chk{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}
.srow.done .setn{color:var(--tx)}

/* Listas */
.li{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);font:inherit;padding:12px 2px;cursor:pointer}
.li small{color:var(--mut);font-size:13px}
.li.ili{flex-direction:row;align-items:center;gap:14px}
.li.ili>span{display:flex;flex-direction:column;min-width:0;flex:1}
.li.ili>span.round{flex:0 0 auto;flex-direction:row}
.li.ili>svg{color:var(--dim)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 0 2px}
.thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#fff;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;filter:var(--thumb-filter)}
.thumb.noimg{background:var(--field);color:var(--mut);filter:none}
.thumbbtn{background:none;border:0;padding:0;line-height:0;cursor:pointer}
.hdet>div{padding:10px 0;border-bottom:1px solid var(--line)}
.hdet>div:last-of-type{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats>div{background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;min-width:0}
.stats small{color:var(--mut);font-size:12px}.stats b{font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .cl{fill:var(--mut);font:11px var(--font)}

/* Calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead b{font-size:17px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--mut);padding-bottom:4px}
.cday{aspect-ratio:1/1;border-radius:50%;border:0;background:none;color:var(--mut);font:500 15px var(--font);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cday.on{background:var(--ac);color:var(--on-ac);font-weight:700;box-shadow:0 0 10px rgba(var(--hl),.2)}
.cday.today{box-shadow:inset 0 0 0 1.5px var(--mut);color:var(--tx)}
.cday.on.today{box-shadow:0 0 10px rgba(var(--hl),.2),inset 0 0 0 2px var(--bg)}
.cday.sel{outline:2px solid var(--ac);outline-offset:2px}

/* Ajustes */
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow>span{flex:1}
.setrow input:not([type=checkbox]){width:84px;text-align:center;min-height:40px;padding:6px}
input.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;min-height:30px;border-radius:15px;background:var(--dim);position:relative;padding:0;cursor:pointer;transition:background .2s;flex:0 0 auto;border:0}
input.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
input.switch:checked{background:var(--switch-on)}
input.switch:checked::after{transform:translateX(20px);background:var(--knob-on)}

/* Barra inferior flotante */
nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;height:66px;display:flex;align-items:center;justify-content:space-around;background:var(--nav-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:33px;z-index:20;box-shadow:var(--pop)}
nav button{background:none;border:0;color:var(--nav-off);width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
nav button svg.i{width:25px;height:25px}
nav button.on{color:var(--nav-on)}
nav button.live::after{content:"";position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 6px var(--ac)}

/* Temporizador de descanso */
#timer{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;background:var(--timer-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:28px;z-index:19;box-shadow:var(--pop)}
#timer svg{width:46px;height:46px;transform:rotate(-90deg);flex:0 0 auto}
#timer .trbg{stroke:var(--dim);fill:none;stroke-width:3.5}
#timer .trfg{stroke:var(--ac);fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:131.95;transition:stroke-dashoffset .5s linear}
.tmid{flex:1;min-width:0}
#ttime{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
#tlabel{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer.over{background:var(--ac);color:var(--on-ac)}
#timer.over #tlabel{color:inherit;opacity:.75}
#timer.over .round{background:var(--on-ac);color:var(--ac)}

/* Hoja inferior (modal) y avisos */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--sheet);border-top:1px solid var(--line);width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--dim);margin:0 auto 14px}
.mhead{display:flex;gap:8px;position:sticky;top:-10px;background:var(--sheet);padding:4px 0 10px;z-index:1;align-items:center}
.bigimg{width:100%;border-radius:20px;background:#fff;margin:10px 0;aspect-ratio:3/2;object-fit:cover}
#catG{margin-bottom:6px}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));max-width:420px;margin:0 auto;background:var(--toast-bg);color:var(--toast-tx);font-weight:600;padding:14px 18px;border-radius:20px;z-index:40;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* v2.1: calorías, cardio y mapa muscular */
.stats.s4{grid-template-columns:repeat(2,1fr)}
.stats.live3{margin-bottom:12px}
.srow.cr{grid-template-columns:34px 1fr 1.6fr 44px}
.srow.cr.tm{grid-template-columns:34px 1fr 1fr 1fr 44px}
.srow select{padding:10px 4px;min-height:44px;font-size:14px;text-align:center}
.srow.done select{background:transparent}
.kc{grid-column:2/-1;font-size:12px;color:var(--mut);padding:0 4px}
.hrow small{display:block}
.bodies{display:flex;gap:2px;flex:0 0 auto}
.bodies.big{justify-content:center;gap:18px;margin:10px 0 6px}
.bodies.big>div{text-align:center}
.bodies.big small{color:var(--mut);font-size:12px;display:block;margin-top:4px}
.bodymap{display:block;width:auto;margin:0 auto}
.bodymap polygon{stroke:var(--body-stroke);stroke-width:6;stroke-linejoin:round}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mut);flex-wrap:wrap;margin-top:6px}
.legend i,.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.mrow{display:grid;grid-template-columns:104px 1fr 76px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow:last-of-type{border-bottom:0}
.mbar{height:8px;background:var(--field);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px}
.mval{text-align:right;font-size:13px}.mval small{display:block;color:var(--mut);font-size:12px}
.seg.mini{margin:0;padding:3px;border-radius:12px;flex:0 0 auto}
.seg.mini button{padding:6px 9px;font-size:13px;border-radius:9px}
.estgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.estgrid>div{background:var(--field);border-radius:12px;padding:8px;display:flex;flex-direction:column;min-width:0}
.estgrid small{color:var(--mut);font-size:11px;white-space:nowrap}.estgrid b{font-size:15px}
/* v2.4: tipos de serie, sugerencias y gráficas */
.setn{flex-direction:column;line-height:1.1}
.setn small.rpe{font-size:10px;color:var(--mut);font-weight:500}
.srow.wu .setn{color:var(--mut)}
.srow.wu input{color:var(--mut)}
.sug{display:flex;align-items:center;gap:12px;background:var(--field);border-radius:16px;padding:10px 12px;margin:6px 0 4px}
.sug>div{flex:1;min-width:0}.sug b{display:block;font-size:14px}.sug small{color:var(--mut);font-size:12px}
.sug>svg{color:var(--mut)}
a.btn{text-decoration:none}

/* ================= ESTILO CLARO ================= */
:root[data-theme=light]{
  color-scheme:light;--bg:#f2f2f7;--card:#fff;--card-hi:#fff;--field:#eeeef3;--line:rgba(0,0,0,.07);
  --tx:#111114;--mut:#6e6e73;--dim:#c7c7cc;--ac:#ff3b30;--on-ac:#fff;--dan:#ff3b30;--hl:255,59,48;
  --nav-bg:rgba(255,255,255,.88);--nav-off:#a1a1a6;--nav-on:#ff3b30;--sheet:#fff;--timer-bg:rgba(255,255,255,.95);
  --toast-bg:#111114;--toast-tx:#fff;--switch-on:#34c759;--knob-on:#fff;--body-off:#dcdce1;--body-head:#ececf1;--body-stroke:#fff;
  --thumb-filter:none;--pop:0 10px 30px rgba(0,0,0,.12);
}
[data-theme=light] .w,[data-theme=light] .card,[data-theme=light] .stats>div{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.05)}
[data-theme=light] .round{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
[data-theme=light] .round.light{background:var(--ac);color:#fff}
[data-theme=light] .btn{background:#fff}
[data-theme=light] .btn.primary{background:linear-gradient(135deg,#ff5e3a,#ff2d55);border:0;color:#fff;box-shadow:0 6px 18px rgba(255,45,85,.3)}
[data-theme=light] .seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
[data-theme=light] .srow.done .chk{background:#34c759;border-color:#34c759;color:#fff}
[data-theme=light] .srow.done{background:rgba(52,199,89,.1)}
[data-theme=light] .cday.on{background:linear-gradient(135deg,#ff5e3a,#ff2d55)}
[data-theme=light] .live{border-color:var(--ac)}
/* iconos de colores en los widgets */
[data-theme=light] main .i-flame{color:#ff3b30}
[data-theme=light] main .i-trophy{color:#ffb300}
[data-theme=light] main .i-scale{color:#30b0c7}
[data-theme=light] main .i-bell{color:#ff9500}
[data-theme=light] main .i-chart{color:#34c759}
[data-theme=light] main .i-timer{color:#5856d6}
[data-theme=light] main .i-calendar,[data-theme=light] main .i-download{color:#007aff}
[data-theme=light] main .i-dumbbell{color:#ff2d55}
[data-theme=light] .bars i.on{background:linear-gradient(#ff5e3a,#ff2d55)}

/* ================= ESTILO PERSONA (prototipo) ================= */
:root[data-theme=persona]{
  --bg:#070707;--card:#000;--card-hi:#000;--field:#fff;--line:#fff;--tx:#fff;--mut:#c9c9c9;--dim:#4a4a4a;
  --ac:#e5141b;--on-ac:#fff;--dan:#ff3b3b;--hl:229,20,27;--r:4px;
  --nav-bg:#000;--nav-off:#fff;--nav-on:#fff;--sheet:#0b0b0b;--timer-bg:#000;--toast-bg:#000;--toast-tx:#fff;

[data-theme=persona] h2,[data-theme=persona] h3,[data-theme=persona] .wfoot b,[data-theme=persona] .rtinfo b,[data-theme=persona] .ex-t b,[data-theme=persona] .calhead b{

/* ================= v0.6: perfil, medallas y experiencia ================= */
.avatar{width:46px;height:46px;border-radius:50%;padding:0;border:2px solid var(--ac);background:var(--card-hi);color:var(--tx);position:relative;flex:0 0 auto;cursor:pointer;overflow:visible}

.avatar .lvb{position:absolute;right:-6px;bottom:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--ac);color:var(--on-ac);font:800 11px/20px var(--font);font-style:normal;text-align:center;border:2px solid var(--bg)}
.ucard{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:22px}

.bigav .cam{position:absolute;right:0;bottom:2px;width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--on-ac);display:flex;align-items:center;justify-content:center}
.uname{text-align:center;font-size:22px;font-weight:700;background:transparent;border-color:transparent;max-width:300px}
.uname:focus{background:var(--field)}
.utitle{width:auto;min-height:36px;padding:4px 14px;border-radius:18px;text-align:center;font-weight:600;color:var(--ac)}
.xpw{width:100%;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.xpw small{grid-column:1/-1;text-align:right;color:var(--mut);font-size:12px}
.lvl{font-size:13px;color:var(--mut);white-space:nowrap}.lvl b{font-size:20px;color:var(--tx);margin-left:3px}
.xp{height:10px;border-radius:6px;background:var(--field);overflow:hidden}
.xp i{display:block;height:100%;background:var(--ac);border-radius:6px;box-shadow:0 0 10px rgba(var(--hl),.6);transition:width .6s}
.meas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.meas>div{background:var(--field);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.meas small{color:var(--mut);font-size:11px}.meas b{font-size:15px}
.mcat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 4px 8px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx);font:inherit;cursor:pointer;min-width:0}
.mcard b{font-size:12px;line-height:1.2;text-align:center;margin-top:4px}
.mcard small{font-size:11px;color:var(--mut)}
.mcard.off b{color:var(--mut)}
.mcard .mnum{font-size:10px}
.mprog{width:80%;height:4px;border-radius:2px;background:var(--field);margin-top:5px;overflow:hidden}.mprog i{display:block;height:100%;background:var(--ac)}
svg.medal{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
svg.medal.locked{filter:grayscale(1) brightness(.55);opacity:.55}
.celeb{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.celeb h3{font-size:30px;margin:0}
.lvup{background:linear-gradient(135deg,rgba(var(--hl),.25),transparent);border:1px solid rgba(var(--hl),.5);border-radius:16px;padding:10px 16px;font-weight:800;font-size:18px;width:100%}
.lvup small{display:block;font-weight:500;font-size:13px;color:var(--mut)}
.cmed{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--field);border-radius:16px;padding:6px 12px}
.cmed small{display:block;color:var(--mut)}
.tiers{width:100%;display:flex;flex-direction:column;gap:6px;margin:6px 0}
.tiers>div{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--field);color:var(--mut)}
.tiers>div.ok{color:var(--tx)}
.tiers i{width:16px;height:16px;border-radius:5px;transform:rotate(45deg);flex:0 0 auto}
.tiers span{flex:1;text-align:left;font-size:14px}
/* barra de experiencia según el estilo */
[data-theme=light] .xp i{background:linear-gradient(90deg,#ff9f0a,#ff2d55)}
[data-theme=persona] .xp{height:16px;border-radius:0;background:#000;border:2px solid #fff;transform:skew(-18deg)}
[data-theme=persona] .xp i{border-radius:0;background:repeating-linear-gradient(-45deg,#e5141b 0 8px,#9d0b10 8px 16px);box-shadow:none}
[data-theme=persona] .lvl{font-family:var(--title-font);text-transform:uppercase;color:#fff;background:#e5141b;padding:0 8px;transform:skew(-10deg)}
[data-theme=persona] .lvl b{color:#fff}
[data-theme=persona] .avatar,[data-theme=persona] .bigav{border-color:#fff;box-shadow:5px 5px 0 #e5141b}
[data-theme=persona] .mcard{border:2px solid #fff;border-radius:0;box-shadow:4px 4px 0 #e5141b}
[data-theme=kingdom] .xp{height:14px;border-radius:8px;background:#06102e;border:2px solid #c9cbd6;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
[data-theme=kingdom] .xp i{background:linear-gradient(180deg,#b8ffbd 0,#5fe06a 40%,#2f9a3a 60%,#1f6e28 100%);box-shadow:0 0 10px rgba(95,224,106,.7)}
[data-theme=kingdom] .lvl{font-family:'Cinzel',Georgia,serif;color:#e8c66a;letter-spacing:.06em}
[data-theme=kingdom] .lvl b{color:#fff3c4;text-shadow:0 0 8px rgba(232,198,106,.8)}
[data-theme=kingdom] .avatar,[data-theme=kingdom] .bigav{border-color:#e8c66a;box-shadow:0 0 14px rgba(232,198,106,.45)}
[data-theme=kingdom] .avatar .lvb{background:var(--cmd);color:#fff;border-color:#c9cbd6}
[data-theme=kingdom] .mcard{border-color:rgba(201,203,214,.28)}
/* menú inferior estilo Kingdom: botones tipo "comandos" con la activa dorada y una corona encima */
[data-theme=kingdom] nav{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;justify-content:center;gap:8px}
[data-theme=kingdom] nav button{width:56px;height:48px;border-radius:12px;background:var(--cmd);border:2px solid #aeb8d8;color:#fff;transform:skewX(-10deg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 #040a22,0 8px 16px rgba(0,0,0,.6);transition:transform .15s}
[data-theme=kingdom] nav button svg.i{transform:skewX(10deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
[data-theme=kingdom] nav button.on{background:linear-gradient(180deg,#fff6cf 0,#e8c66a 45%,#b98b2a 55%,#7a5512 100%);border-color:#fff7d6;color:#2a1d05;
  transform:skewX(-10deg) translateY(-8px) scale(1.08);box-shadow:inset 0 1px 0 #fff,0 4px 0 #4a3308,0 0 22px rgba(232,198,106,.65)}
[data-theme=kingdom] nav button.on svg.i{filter:none}
[data-theme=kingdom] nav button.on::before{content:"";position:absolute;top:-17px;left:50%;width:20px;height:14px;transform:translateX(-50%) skewX(10deg);
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2020%2014%22%3E%3Cpath%20d%3D%22M1%2013L2%203L6.5%207.5L10%200L13.5%207.5L18%203L19%2013Z%22%20fill%3D%22%23e8c66a%22%20stroke%3D%22%23fff6cf%22%20stroke-width%3D%221%22/%3E%3C/svg%3E") center/contain no-repeat;filter:drop-shadow(0 0 4px rgba(232,198,106,.9))}
[data-theme=kingdom] nav button.live::after{background:#5fe06a;box-shadow:0 0 6px #5fe06a;top:4px;right:5px}

/* ventanas de aviso propias */
#dialog{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--sheet);color:var(--tx);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;max-width:360px;width:100%;box-shadow:var(--pop)}
.dlg p{margin:0 0 18px;font-size:16px;line-height:1.45}
.dlg input{margin:-6px 0 16px}
.dlg-b{display:flex;gap:10px}.dlg-b .btn{flex:1;min-height:48px}
.btn.danger-fill{background:var(--dan);border-color:var(--dan);color:#fff}
[data-theme=persona] .dlg{border:3px solid #fff;border-radius:0;box-shadow:8px 8px 0 #e5141b;transform:rotate(-1deg)}
</style>
</head>
<body>
<main id="app"></main>

<div id="timer" hidden>
  <svg viewBox="0 0 48 48"><circle class="trbg" cx="24" cy="24" r="21"/><circle class="trfg" id="tarc" cx="24" cy="24" r="21"/></svg>
  <div class="tmid"><div id="ttime">0:00</div><div id="tlabel"></div></div>
  <button class="round sm" data-a="tMinus">−15</button>
  <button class="round sm" data-a="tPlus">+15</button>

</div>

<nav id="nav"></nav>
<div id="toast" hidden></div>
<div id="dialog" hidden></div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="data.js"></script>
<script src="medals.js"></script>
<script src="app.js"></script>
