<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GymLog</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#232733;--tx:#eef0f4;--mut:#8b92a3;--ac:#4ade80;--ac2:#22c55e;--dan:#f87171;--bd:#2c313d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{padding:calc(12px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
body.has-timer main{padding-bottom:calc(180px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:8px 0 16px}
h2{font-size:15px;margin:24px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
h3{margin:0 0 10px;font-size:17px}
p{margin:6px 0}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{appearance:none;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:inherit;font-weight:600;padding:12px 16px;border-radius:12px;cursor:pointer;min-height:46px;text-align:center}
.btn.primary{background:var(--ac2);border-color:var(--ac2);color:#05200f}
.btn.ghost{background:transparent}
.btn.danger{color:var(--dan)}
.btn.block{display:block;width:100%;margin:8px 0}
.btn.big{padding:18px;font-size:18px}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px;flex:0 0 auto}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.muted{color:var(--mut)}.small{font-size:13px}.center{text-align:center}
.wk-head{display:flex;gap:10px;align-items:center;margin:4px 0 14px}
.wk-name{flex:1;min-width:0;font-size:20px;font-weight:700;background:transparent;border-color:transparent;padding:6px 4px}
.pill{background:var(--card2);padding:6px 12px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-head{display:flex;align-items:center;gap:8px}
.ex-head b{flex:1;font-size:17px}
.rest{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;margin-top:6px}
.rest input{width:72px;min-height:34px;padding:4px 8px;text-align:center}
table.sets{width:100%;border-collapse:collapse;margin:10px 0 4px;table-layout:fixed}
.sets th:first-child{width:40px}.sets th:nth-child(2){width:74px}.sets th:last-child{width:54px}
.sets th{font-size:12px;color:var(--mut);font-weight:600;text-align:center;padding:4px}
.sets td{padding:4px 3px;text-align:center}
.sets td.prev{font-size:13px;color:var(--mut);white-space:nowrap}
.sets input{text-align:center;padding:8px 4px;min-height:42px}
.sets tr.done td{background:rgba(74,222,128,.12)}
.sets tr.done td:first-child{border-radius:10px 0 0 10px}
.sets tr.done td:last-child{border-radius:0 10px 10px 0}
.setn{background:var(--card2);border:0;color:var(--tx);width:32px;height:32px;border-radius:8px;font:inherit;font-weight:700}
.chk{width:46px;height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--mut);font-size:20px;font-weight:800}
tr.done .chk{background:var(--ac2);color:#05200f;border-color:var(--ac2)}
.li{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);font:inherit;padding:12px 4px;cursor:pointer}
.li small{color:var(--mut)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);margin:16px 0 2px}
.hdet>div{padding:8px 0;border-bottom:1px solid var(--bd)}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0}
.sw input{width:22px;height:22px;min-height:22px;accent-color:var(--ac2);flex:0 0 auto}
.field{display:block;margin:8px 0;color:var(--mut);font-size:13px}
.field input,.field select{margin-top:4px;color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button span{font-size:22px;line-height:1.1}
nav button.on{color:var(--ac)}
nav button.live::after{content:"";position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--ac)}
#timer{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:624px;margin:0 auto;background:var(--card2);border:1px solid var(--bd);border-radius:16px;z-index:19;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#timer.over{background:#14532d;border-color:var(--ac)}
.tbar{height:5px;background:var(--bd)}
#tprog{height:100%;background:var(--ac);transition:width .5s linear}
.trow{display:flex;align-items:center;gap:8px;padding:10px}
.tmid{flex:1;text-align:center;min-width:0}
#ttime{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
#tlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.mhead{display:flex;gap:8px;position:sticky;top:-16px;background:var(--card);padding:4px 0 8px;z-index:1}
.mhead .btn{flex:0 0 auto}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#fff;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.thumb.noimg{background:var(--card2);font-size:22px}
.thumbbtn{background:none;border:0;padding:0;line-height:0;cursor:pointer}
.li.ili{flex-direction:row;align-items:center;gap:12px}
.li.ili>span{display:flex;flex-direction:column;min-width:0}
.bigimg{width:100%;border-radius:12px;background:#fff;margin:8px 0;aspect-ratio:3/2;object-fit:cover}
#catG{margin-bottom:6px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:10px;border-radius:9px}
.seg button.on{background:var(--card2);color:var(--tx)}
.stats{display:flex;gap:8px;margin-bottom:8px}
.stats>div{flex:1;background:var(--card2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.stats small{color:var(--mut);font-size:12px}.stats b{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .cl{fill:var(--mut);font-size:10px}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));max-width:600px;margin:0 auto;background:#14532d;border:1px solid var(--ac);color:var(--tx);font-weight:700;padding:14px 16px;border-radius:14px;z-index:40;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<main id="app"></main>

<div id="timer" hidden>
  <div class="tbar"><div id="tprog"></div></div>
  <div class="trow">
    <button class="btn sm" data-a="tMinus">−15</button>
    <div class="tmid"><div id="ttime">0:00</div><div id="tlabel" class="small muted"></div></div>
    <button class="btn sm" data-a="tPlus">+15</button>
    <button class="btn sm" data-a="tSkip" id="tskip">Saltar</button>
  </div>
</div>

<nav>
  <button data-a="nav" data-view="train"><span>🏋️</span>Entrenar</button>
  <button data-a="nav" data-view="routines"><span>📋</span>Rutinas</button>
  <button data-a="nav" data-view="exercises"><span>💪</span>Ejercicios</button>
  <button data-a="nav" data-view="progress"><span>📈</span>Progreso</button>
  <button data-a="nav" data-view="history"><span>📅</span>Historial</button>
  <button data-a="nav" data-view="settings"><span>⚙️</span>Ajustes</button>
</nav>

<div id="toast" hidden></div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="app.js"></script>
</body>
</html>
